<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GC Threads - Set Username</title>
    <link rel="stylesheet" href="../Backend/style.css" />
</head>
<body>
    <div id="usernameSetupPage" class="page active">
        <div class="container">
            <div class="login-card">
                <div class="logo-container">
                    <div class="logo-circle">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <h1>Welcome to GC-THREADS!</h1>
                    <p class="subtitle">Would you like to set a custom username?</p>
                </div>

                <div class="info-box-blue">
                    You can choose a username now or skip and use your email prefix. You can always change it later in your profile settings.
                </div>

                <form id="usernameSetupForm">
                    <div class="form-group">
                        <label>Username (Optional)</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input type="text" id="usernameInput" placeholder="Enter a username">
                        </div>
                        <p class="help-text">3–20 characters, letters, numbers, and underscores only</p>
                    </div>

                    <div id="usernameError" class="error-message hidden"></div>

                    <button type="submit" class="btn btn-primary">
                        <span id="usernameButtonText">Continue without Username</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </button>

                    <button type="button" id="skipUsernameBtn" class="btn btn-secondary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                        Skip for now
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small-text">Your username will be visible to other students</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/username-page.js"></script>
</body>
</html>
