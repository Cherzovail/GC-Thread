<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GC Threads - Register</title>
    <link rel="stylesheet" href="../Backend/style.css" />
</head>
<body>
    <div id="registerPage" class="page active">
        <div class="container">
            <div class="login-card">
                <div class="logo-container">
                    <div class="logo-circle">G</div>
                    <h1>Create Account</h1>
                    <p class="subtitle">Join GC-THREADS</p>
                </div>

                <form id="registerForm">
                    <div class="form-group">
                        <label>GC Email Address</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="M3 7l9 6 9-6"/>
                            </svg>
                            <input type="email" id="registerEmail" placeholder="student@gordoncollege.edu.ph" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="11" width="14" height="10" rx="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                            <input type="password" id="registerPassword" placeholder="Create a password (min. 6 chars)" required minlength="6">
                        </div>
                    </div>

                    <div id="registerError" class="error-message hidden"></div>

                    <button type="submit" class="btn btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                        </svg>
                        Create Account
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small-text">Already have an account?
                        <button type="button" id="showLoginBtn" class="link-btn-primary">Sign in</button>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/register-page.js"></script>
</body>
</html>
